<!DOCTYPE html>
<html>
<head>
    <title>Fake News Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f5f5;
        }
        .container {
            margin: 50px auto;
            padding: 30px;
            width: 500px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        textarea, input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        button {
            padding: 10px 25px;
            margin-top: 15px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>📰 Fake News Detector</h2>

    <textarea id="news" rows="8" placeholder="Enter news text here..."></textarea>
    <br>
    <button onclick="predict()">Check News</button>

    <h3>OR Check via URL</h3>
    <input type="text" id="url" placeholder="Enter news URL">
    <br>
    <button onclick="predictURL()">Check URL</button>

    <h3 id="result"></h3>
</div>

<script>
function predict() {
    let text = document.getElementById("news").value.trim();

    if(text === "") {
        alert("Please enter some news text.");
        return;
    }

    document.getElementById("result").innerText = "Analyzing text...";

    fetch("/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ text: text })
    })
    .then(res => res.json())
    .then(data => {
        let color = data.prediction === "REAL" ? "green" : "red";
        let message = data.prediction === "REAL" ? "This news appears trustworthy ✅" : "This news may be fake ⚠️";

        document.getElementById("result").innerHTML =
            `<span style="color:${color}">${message}<br>${data.prediction} (${data.confidence}% confidence)</span>`;
    })
    .catch(err => {
        document.getElementById("result").innerText = "Error processing text.";
        console.error(err);
    });
}

function predictURL() {
    let url = document.getElementById("url").value.trim();

    if(url === "") {
        alert("Please enter a URL");
        return;
    }

    document.getElementById("result").innerText = "Fetching and analyzing article...";

    fetch("/predict_url", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ url: url })
    })
    .then(res => res.json())
    .then(data => {
        if(data.error) {
            document.getElementById("result").innerText = data.error;
            return;
        }

        let color = data.prediction === "REAL" ? "green" : "red";
        let message = data.prediction === "REAL" ? "This news appears trustworthy ✅" : "This news may be fake ⚠️";

        document.getElementById("result").innerHTML =
            `<span style="color:${color}">${message}<br>${data.prediction} (${data.confidence}% confidence)</span>`;
    })
    .catch(err => {
        document.getElementById("result").innerText = "Error fetching URL.";
        console.error(err);
    });
}
</script>
</body>
</html>
